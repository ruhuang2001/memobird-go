version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files need no package comment, and HTTP test handlers routinely
      # ignore the request or writer they do not read.
      - path: _test\.go
        linters:
          - revive
        text: (package-comments|unused-parameter)

formatters:
  enable:
    - gofmt
    - goimports
